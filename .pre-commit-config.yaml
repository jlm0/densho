exclude: ^engine/knowledge_architecture/(generated/metamodel|vendor/ste_lint)|(^|/)AGENTS\.md$|^\.claude/(rules/knowledge|skills)/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: schema-lint
        name: linkml lint
        entry: uv run --frozen linkml-lint --config governance/schema/linkml-lint.yaml governance/schema/metamodel.yaml
        language: system
        files: ^governance/schema/
        pass_filenames: false
      - id: schema-models
        name: generate models from the schema
        entry: >-
          sh -c 'mkdir -p build &&
          uv run --frozen gen-pydantic --meta None --template-dir governance/schema/templates governance/schema/metamodel.yaml > build/metamodel.py &&
          uv run --frozen gen-python --no-metadata governance/schema/metamodel.yaml > build/metamodel_rdf.py &&
          uv run --frozen gen-shacl --no-metadata governance/schema/metamodel.yaml > build/metamodel.shacl.ttl &&
          uv run --frozen gen-owl --no-metadata --no-use-native-uris --consolidate-cardinality-axioms --skip-vacuous-local-range-axioms --skip-vacuous-min-zero-cardinality-axioms governance/schema/metamodel.yaml > build/metamodel.owl.ttl &&
          cp build/metamodel.py build/metamodel_rdf.py build/metamodel.shacl.ttl build/metamodel.owl.ttl governance/schema/metamodel.yaml engine/knowledge_architecture/generated/'
        language: system
        pass_filenames: false
        always_run: true
      - id: node-format
        name: parse the knowledge nodes
        entry: uv run --frozen ka parse knowledge skills governance
        language: system
        pass_filenames: false
        always_run: true
      - id: graph-checks
        name: check the knowledge graph
        entry: uv run --frozen ka graph
        language: system
        pass_filenames: false
        always_run: true
      - id: directive-checks
        name: check how directives reach the nodes
        entry: uv run --frozen ka directives
        language: system
        pass_filenames: false
        files: ^(knowledge|skills|governance|engine)/|^uv\.lock$
      - id: governance-checks
        name: check the lifecycle and the change rules
        entry: uv run --frozen ka governance
        language: system
        pass_filenames: false
        always_run: true
      - id: language-checks
        name: check the language of the knowledge nodes
        entry: uv run --frozen ka language
        language: system
        pass_filenames: false
        files: ^(knowledge|skills|governance|engine)/|^uv\.lock$
      - id: compiled-outputs
        name: compile the checked graph
        entry: uv run --frozen ka build
        language: system
        pass_filenames: false
        files: ^(knowledge|skills|governance|engine)/|^uv\.lock$
      - id: runtime-files
        name: generate the runtime files
        entry: uv run --frozen ka runtime --verify
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      - id: mdformat
        name: mdformat
        entry: uv run --frozen mdformat
        language: system
        types: [markdown]
      - id: pyright
        name: pyright
        entry: uv run --frozen pyright
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: uv run --frozen pytest
        language: system
        pass_filenames: false
        always_run: true
