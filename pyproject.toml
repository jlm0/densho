[project]
name = "knowledge-architecture"
version = "0.0.0"
description = "Governed knowledge architecture for human and agent workspaces."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "jinja2>=3.1.6",
    "linkml-runtime>=1.12.1",
    "markdown-it-py>=3",
    "networkx>=3.7",
    "pydantic>=2",
    "pyshacl>=0.40.2",
    "rdflib>=7.6.0",
    "ruamel-yaml>=0.18",
    "spacy>=3.8.18",
    "typer>=0.27.3",
]

[project.scripts]
ka = "engine.cli:app"

[build-system]
requires = ["uv_build>=0.8.4,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "engine"
module-root = ""
wheel-exclude = ["engine/schema"]

[tool.ruff]
target-version = "py314"
line-length = 100
src = [".", "tests"]
extend-exclude = ["engine/generated", "engine/vendor"]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "CPY", "D"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["INP001", "S101"]

[tool.pyright]
include = ["engine", "tests"]
ignore = ["engine/generated", "engine/vendor"]
pythonVersion = "3.14"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers", "-ra"]
xfail_strict = true

[dependency-groups]
dev = [
    "copier>=9.19.1",
    "linkml>=1.12.1",
    "mdformat>=0.7.22",
    "mdformat-frontmatter>=2.1.2",
    "mdformat-gfm>=1.0.0",
    "mdformat-tables>=1.0.0",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]
