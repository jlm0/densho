exclude: ^engine/knowledge_architecture/generated/metamodel\.py$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
        args: [--assume-in-merge]
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: uv-lock
        name: uv lock check
        entry: uv lock --check
        language: system
        files: ^(pyproject\.toml|uv\.lock)$
        pass_filenames: false
      - id: schema-lint
        name: linkml lint
        entry: uv run --frozen linkml-lint --config governance/schema/linkml-lint.yaml governance/schema/metamodel.yaml
        language: system
        files: ^governance/schema/
        pass_filenames: false
      - id: schema-models
        name: generate models from the schema
        entry: >-
          sh -c 'mkdir -p build &&
          uv run --frozen gen-pydantic --meta None --template-dir governance/schema/templates governance/schema/metamodel.yaml > build/metamodel.py &&
          cp build/metamodel.py engine/knowledge_architecture/generated/metamodel.py'
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check
        entry: uv run --frozen ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run --frozen ruff format
        language: system
        types_or: [python, pyi]
      - id: mdformat
        name: mdformat
        entry: uv run --frozen mdformat
        language: system
        types: [markdown]
      - id: pyright
        name: pyright
        entry: uv run --frozen pyright
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: uv run --frozen pytest
        language: system
        pass_filenames: false
        always_run: true
