_min_copier_version: "9.19"
_exclude:
  - "*"
  - "!/AGENTS.md"
  - "!/.copier-answers.yml"
  - "!/.gitignore"
  - "!/.pre-commit-config.yaml"
  - "!/.claude/references/"
  - "!/.claude/rules/knowledge/"
  - "!/.claude/skills/"
  - "!/knowledge/"
  - ".DS_Store"
  - "__pycache__"
_skip_if_exists:
  - "/AGENTS.md"
  - "/.claude/references/"
  - "/.claude/rules/knowledge/"
  - "/.claude/skills/"
  - "/.gitignore"
  - "{% if started_from == _copier_conf.vcs_ref_hash %}/.pre-commit-config.yaml{% endif %}"
_tasks:
  - command: ["knowledge/.densho/densho", "select"]
    when: "{{ _copier_operation == 'update' }}"
  - command: ["knowledge/.densho/densho", "adopt", "--keep-accepted"]
    when: "{{ _copier_operation == 'copy' and keep_template_status }}"
  - command: ["knowledge/.densho/densho", "adopt"]
    when: "{{ _copier_operation == 'copy' and not keep_template_status }}"
_message_after_copy: |
  The project now owns this copy. To run the checks on each commit:

    uv tool install pre-commit
    pre-commit install

  Then stage the files and commit them. Each clone of the project needs the second command.

  {% if keep_template_status -%}
  Each entity that the template accepted keeps its status, unless the selection changed it.
  Each other entity starts as a proposal. To read and accept the proposals:
  {%- else -%}
  Each entity starts as a proposal, so nothing is in force yet. To read and accept them:
  {%- endif %}

    knowledge/.densho/densho view
    knowledge/.densho/densho accept --subtree <node-id>

  The first command writes a site to build/view/. A person runs the second one, reads git diff,
  runs knowledge/.densho/densho runtime, and commits the result.
_message_after_update: |
  Resolve each conflict, and remove each conflict marker. Then run:

    knowledge/.densho/densho adopt

  Then read the result, stage the files, and commit them.

disciplines:
  type: str
  help: The disciplines that this project takes. Each project also receives the root, the governance, and each skill that uses only what the project takes.
  multiselect: true
  choices:
    Product strategy: product-strategy
    User research: user-research
    Brand design: brand-design
    Content design: content-design
    UI/UX design: ui-ux-design
    Software engineering: software-engineering
  default: [product-strategy, user-research, brand-design, content-design, ui-ux-design, software-engineering]

keep_template_status:
  type: bool
  help: Keep each status that the template accepted. Answer yes only if you accept that content for this project.
  default: false

started_from:
  type: str
  help: The template commit that this project starts from. Keep the default.
  default: "{{ _copier_conf.vcs_ref_hash }}"
