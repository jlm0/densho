title: Name the rules for an error message in an interface
canary: true
prompt: |
  Which rules of this project apply when you write an error message in an interface?
  Answer with the ID of each rule that applies, one ID on each line.
  Give only IDs that you find in the files of this project.
  If no rule applies, answer NONE.
tools: [Read, Glob, Grep]
targets:
  - directive: keep-input-after-error
    checks:
      - path: "@reply"
        contains: '(?<![\w-])keep-input-after-error(?![\w-])'
