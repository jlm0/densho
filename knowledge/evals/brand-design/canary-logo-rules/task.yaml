title: Name the rules for the logo section of brand guidelines
canary: true
prompt: |
  Which rules of this project apply when you write the logo section of brand guidelines?
  Answer with the ID of each rule that applies, one ID on each line.
  Give only IDs that you find in the files of this project.
  If no rule applies, answer NONE.
tools: [Read, Glob, Grep]
targets:
  - directive: nothing-in-clear-space
    checks:
      - path: "@reply"
        contains: '(?<![\w-])nothing-in-clear-space(?![\w-])'
